<!DOCTYPE html>
<html>
    <head>
        <title>search bar</title>
        <style>
            .bar {
                display: flex;
                flex-direction: row;
                background-color: rgb(120, 82, 178);
                justify-content: space-between;
                padding-left: 15px;
                padding-right: 15px;
                align-items: center;
            }

            .home {
                font-weight: bold;
                color: white;
                font-family: Arial, Helvetica, sans-serif;
            }

            .search {
                background-color: white;
                font-family: Arial, Helvetica, sans-serif;
                width: 500px;
                height: 30px;
                border: none;
                margin-top: 12px;
                margin-bottom: 12px;
                border-radius: 15px;
                padding-left: 20px;
                
            }
            
            button {
                color: white;
                background-color: rgb(120, 82, 178);
                border: 1px solid white;
                font-size: 16px;
                padding-left: 15px;
                padding-right: 15px;
                padding-top: 8px;
                padding-bottom: 8px;
            }
        </style>
    </head>
    <body>
        <div class="bar">
            <div class="home">Home</div>
            <input class="search" placeholder="Search">
            <button>Download</button>
        </div>
    </body>
</html>
