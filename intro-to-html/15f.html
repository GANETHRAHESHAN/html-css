<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            height: 3000px;
        }

        img {
            width: 300px;
            height: 300px;
            object-fit: cover;
        }

        .container {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .text {
            background-color: black;
            color: white;
            position: absolute;
            top: 10px;
            right: 0px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 5px;
            padding-bottom: 5px;
            font-family: arial
        }

        .cart {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
            height: 80px;
            bottom: 0;
            left: 0;
            right: 0;
        }

        .add-to-cart-button {
            background-color: white;
            border-width: 1px;
            border-style: solid;
            border-color: black;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            padding-right: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="pictures/shirt.jpg">
        <div class="text">20% OFF</div>
        <div class="cart">
            <button class="add-to-cart-button">Add to Cart</button>
        </div>
    </div>
</body>

</html>
