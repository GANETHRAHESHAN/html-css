<!DOCTYPE html>
<html>

<head>
    <title>box</title>
    <style>
        .box {
            border: solid;
            border-width: 1px;
            width: 300px;
            height: 100px;
            padding: 8px;
            display: block;
        }

        .yes,
        .no {
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="box">
        <p class="text">Satisfied with our service?</p>
        <button class="yes">Yes</button>
        <button class="no">No</button>
    </div>
</body>

</html>
