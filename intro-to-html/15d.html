<html>

<head>
    <style>
        body {
            height: 3000px;
        }


        .bottom-right {
            background-color: gray;
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            height: 180px;
        }

        .close-button {
            background-color: black;
            color: white;
            position: absolute;
            top: -20px;
            left: -20px;
            font-family: arial;
            width: 45px;
            height: 45px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .time {
            background-color: black;
            color: white;
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-family: arial;
            width: 60px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="bottom-right">
        <div class="close-button">X</div>
        <div class="time">0:29</div>
    </div>
</body>

</html>
