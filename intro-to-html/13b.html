<!DOCTYPE html>
<html>

<head>
    <title>nested flexbox</title>
    <style>
        .flexbox {
            display: flex;
            flex-direction: row;
            height: 50px;
        }

        .column2 {
            background-color: lightblue;
            width: 200px;
            display: flex;
            flex-direction: column;
        }

        .column1 {
            background-color: lightpink;
            width: 100px;
        }


        .row2 {
            display: flex;
            flex-direction: row;
            color: white;
            justify-content: space-between;
        }

        .item {
            background-color: black;
            
        }
    </style>
</head>

<body>
    <div class="flexbox">
        <div class="column1"></div>
        <div class="column2">
                <div>row 1</div>
                <div class="row2">
                    <div class="item">row2</div>
                    <div class="item">row2</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
