<!DOCTYPE html>
<html>
    <head>
        <title>facebook</title>
        <style>
            .image1 {
                width: 200px;
                height: 200px;
                object-fit: cover;
                margin-bottom: 12px;
            }

            .text1 {
                font-weight: bold;
                font-family: arial;
                font-size: 15px;
                padding: 5px;
                margin-bottom: 0px;
            }

            .text2 {
                font-family: arial;
                font-size: 12px;
                color: rgb(107, 106, 106);
                padding: 5px;
                margin-top: 0;
                margin-bottom: 2px;
            }

            div {
                box-shadow: 0px 0px 2px gray; 
                display: inline-block; 
                vertical-align: top;
                margin-left: 10px;
                width: 200px;
 
            }

            .button {
                padding: 5px;
                background-color: rgb(28, 150, 249);
                color: white;
                border-radius: 3px;
                border: none;
                margin-left: 5px;
                margin-bottom: 5px;
                margin-top: 0px;
                font-size: 13px;
            }

            .button:hover {
                cursor: pointer;
                opacity: 0.7;
            }
        </style>
    </head>
    <body>
        <div>
            <img class="image1" src="pictures/cat.jpg">
            <p class="text1">Oliver</p>
            <p class="text2">3 mutual friends</p>
            <button class="button">Add Friends</button>
        </div>

        <div>
            <img class="image1" src="pictures/cat2.jpg">
            <p class="text1">Mimi</p>
            <p class="text2">2 mutual friends</p>
            <button class="button">Add Friends</button>
        </div>

        <div>
            <img class="image1" src="pictures/dog.jpg">
            <p class="text1">Rex</p>
            <p class="text2">4 mutual friends</p>
            <button class="button">Add Friends</button>
        </div>
    </body>
</html>
