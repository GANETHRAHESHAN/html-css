<!DOCTYPE html>
<html>
    <head>
        <title>inbox</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
            }
            .box {
                padding-left: 15px;
                padding-right: 15px;
                box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.25);
                padding-bottom: 10px;
                padding-top: 10px;
                width: 400px;
                border-radius: 4px;
                margin-top: 20px;
                margin-bottom: 20px;
            }

            .profile-pic {
                margin-right: 10px;
            }

            img {
                width: 50px;
                height: 50px;
                border-radius: 25px;
                object-fit: cover;
            }

            .msg-box {
                display: flex;
                align-items: center;
                margin-bottom: 20px;
            }

            .content {
                flex: 1;
            }

            .top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 3px;
            }

            .all-inbox {
                color: rgb(134, 134, 134);
                font-size: 14px;
                margin-bottom: 20px;
            }

            .text {
                font-weight: bold;
                font-size: 18px;
            }

            .time {
                color: rgb(134, 134, 134);
                font-size: 15px;
            }

            .middle {
                font-weight: bold;
                margin-bottom: 5px;
            }

            .bottom {
                color: rgb(134, 134, 134);
                font-size: 15px;
            }


        </style>
    </head>
    <body>
        <div class="box">
            <div class="all-inbox">ALL INBOXES</div>
            <div class="msg-box">
                <div class="profile-pic"><img src="pictures/cat.jpg"></div>
                <div class="content">
                    <div class="top">
                        <div class="text">Chew Promotions</div>
                        <div class="time">4:58 PM</div>
                    </div>
                    <div class="middle">Biggest sales of the year!</div>
                    <div class="bottom">Hey there! We're writing to tell you about our ...</div>
                </div>
            </div>
        </div>
    </body>
</html>
