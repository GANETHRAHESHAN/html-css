<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <style>
            body {
                height: 3000px;
                font-family: Arial, Helvetica, sans-serif;
            }

            .server-icon {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                background-color: rgb(33, 33, 3);
                width: 75px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                padding-top: 10px;
            }

            .info {
                position: fixed;
                left: 75px;
                top: 0;
                bottom: 0;
                width: 150px;
                background-color: rgb(55, 55, 55);
                padding-left: 15px;
                padding-right: 15px;
                line-height: 25px;
                color: rgb(150, 150, 150);
            }

            img {
                width: 50px;
                height: 50px;
                border-radius: 25px;
                padding-left: 5px;
                object-fit: cover;
            }

            .top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding-right: 10px;
                padding-top: 15px;
            }
            .pluse {
                font-size: 25px
            }
        </style>
    </head>
    <body>
        <div class="server-icon">
            <img src="pictures/cat.jpg">
            <img src="pictures/cat2.jpg">
            <img src="pictures/cat3.jpg">
        </div>
        <div class="info">
            <div class="top">
                <div>INFO</div>
                <div class="pluse">+</div>
            </div>
            <div># new-videos</div>
            <div># updates</div>
            <div># faq</div>
        </div>
    </body>
</html>
