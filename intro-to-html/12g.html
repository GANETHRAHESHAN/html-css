<!DOCTYPE html>
<html>

<head>
    <title>cat profile</title>
    <style>
        .main-div {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }



        .profile-picture {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            object-fit: cover;
            margin-right: 15px;
        }

        .name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .description {
            width: 200px;
        }

        p {
            font-family: arial;
            margin-top: 0;
            margin-bottom: 0;
        }


        button {
            border: none;
            background-color: rgb(36, 158, 224);
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            padding-right: 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        .animal {
            color: gray;
            margin-bottom: 3px;
        }

        .popular {
            color: gray;
            font-size: 14px;
        }

        .row {
            display: flex;
            flex-direction: row;
            align-items: center;
            margin-bottom: 20px;
        

        }
    </style>
</head>

<body>
    <div class="main-div">
        <div class="row">

            <img class="profile-picture" src="pictures/cat.jpg">

            <div class="description">
                <p class="name">Oliver</p>
                <p class="animal">the cat</p>
                <p class="popular">Popular</p>
            </div>
            <div class="follow-div">
                <button class="follow-button">Follow</button>
            </div>
        </div>
        <div class="row">

            <img class="profile-picture" src="pictures/cat2.jpg">

            <div class="description">
                <p class="name">Mimi</p>
                <p class="animal">Sleepy cat</p>
                <p class="popular">Popular</p>
            </div>

            <button class="follow-button">Follow</button>

        </div>
        <div class="row">

            <img class="profile-picture" src="pictures/dog.jpg">

            <div class="description">
                <p class="name">Rex</p>
                <p class="animal">Happy Bulldog</p>
                <p class="popular">Popular</p>
            </div>

            <button class="follow-button">Follow</button>
        </div>
    </div>
</body>

</html>
