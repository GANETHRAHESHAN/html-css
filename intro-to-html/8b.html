<!DOCTYPE html>
<html>

<head>
    <title>paragraph and two button</title>
    <style>
        p {
            width: 210px;
        }

        input,
        p {
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <p>
        Thanks for chatting with our customer support. Would you like to take our quick survey&#63;
    </p>
    <input type="button" value="Yes">
    <input type="button" value="No">
</body>

</html>
