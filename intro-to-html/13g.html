<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <Style>
            body {
                font-family: Arial, Helvetica, sans-serif;
            }

            .main-div {
                display: flex;
                width: 420px;
            }
            img {
                width: 50px;
                height: 50px;
                border-radius: 25px;
            }

            .content {
                flex: 1;
                margin-left: 10px;
            }

            .link {
                display: flex;
                align-items: center;
                border: 1px solid lightgrey;
                width: 300px;
                border-radius: 15px;
                overflow: hidden;
            }

            .pic-youtube {
                width: 100px;
                height: 100px;
                background-color: lightgray;
            }

            .username {
                color: gray;
            }

            .text {
                flex: 1;
                margin-left: 10px;
            }

            .youtube-com {
                color: gray;
            }

            .email {
                margin-bottom: 5px;
            }

            .msg {
                margin-bottom: 10px;
                line-height: 20px;
            }

            .description {
                line-height: 22px;
            }
        </Style>
    </head>
    <body>
        <div class="main-div">
            <div class="profile-pic">
                <img src="pictures/cat.jpg">
            </div>
            <div class="content">
                <div class="email"><strong>supersimple.dev</strong> <span class="username">@superSimpleDev</span></div>
                <div class="msg">What is backend web development? A complete overview. New video is up!</div>
                <div class="link">
                    <div class="pic-youtube"></div>
                    <div class="text">
                        <div class="youtube-com">youtube.com</div>
                        <div class="description">Backend web development - a complete overview (2021)</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
