<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                height: 3000px;
            }

            img {
                width: 250px;
                height: 250px;
                object-fit: cover;
            }

            .container {
                position: relative;
                width: 250px;
                height: 250px;
            }

            .text {
                background-color: black;
                color: white;
                position: absolute;
                top: 10px;
                right: 0px;
                padding-left: 10px;
                padding-right: 10px;
                padding-top: 5px;
                padding-bottom: 5px;
                font-family: arial

            }
        </style>
    </head>
    <body>
        <div class="container">
            <img src="pictures/shirt.jpg">
            <div class="text">20% OFF</div>
        </div>
    </body>
</html>
