<!DOCTYPE html>
<html>

<head>
    <title></title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            height: 3000px;
        }

        .right-sidebar {
            position: fixed;
            bottom: 0px;
            top: 0;
            right: 0;
            width: 100px;
            background-color: green;
            color: white;

        }

        .overlay {
            position: fixed;
            background-color: rgba(0, 0, 0, 0.8);
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .model {
            background-color: white;
            padding-left: 10px;
            padding-top: 10px;
            width: 200px;
            padding-bottom: 10px;
            border-radius: 4px;
        }

        .modal-title {
            font-weight: bold;
            margin-bottom: 5px
        }

        .modal-content {
            margin-bottom: 5px;
        }

    </style>
</head>

<body>
    <div class="right-sidebar">
        right sidebar
    </div>
    <div class="overlay">
        <div class="model">
            <div class="modal-title">
                Modal Title
            </div>
            <div class="modal-content">
                This is a modal
            </div>
            <button>
                Close
            </button>
        </div>

    </div>
</body>

</html>
